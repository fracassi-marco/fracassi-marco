<svg width="900" height="220" viewBox="0 0 900 220" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgStats" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0a0a"/>
      <stop offset="55%" stop-color="#111111"/>
      <stop offset="100%" stop-color="#1a1a1a"/>
    </linearGradient>
    <linearGradient id="barGrad" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#E64A19"/>
      <stop offset="55%" stop-color="#FF5722"/>
      <stop offset="100%" stop-color="#FF7043"/>
    </linearGradient>
  </defs>

  <rect width="900" height="220" rx="18" fill="url(#bgStats)"/>
  <rect x="1" y="1" width="898" height="218" rx="17" fill="none" stroke="#ffffff" stroke-opacity="0.07"/>

  <!-- subtle grid -->
  <g stroke="#ffffff" stroke-opacity="0.05">
    <line x1="0" y1="55" x2="900" y2="55"/>
    <line x1="0" y1="110" x2="900" y2="110"/>
    <line x1="0" y1="165" x2="900" y2="165"/>
  </g>

  <!-- bar chart motif -->
  <g transform="translate(60,20)">
    <rect x="0"   y="140" width="26" height="60" rx="4" fill="url(#barGrad)" opacity="0.55"/>
    <rect x="36"  y="110" width="26" height="90" rx="4" fill="url(#barGrad)" opacity="0.7"/>
    <rect x="72"  y="80"  width="26" height="120" rx="4" fill="url(#barGrad)" opacity="0.85"/>
    <rect x="108" y="50"  width="26" height="150" rx="4" fill="url(#barGrad)"/>
    <rect x="144" y="20"  width="26" height="180" rx="4" fill="url(#barGrad)"/>
    <!-- trend line -->
    <polyline points="13,150 49,120 85,90 121,60 157,30" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.85"/>
    <circle cx="157" cy="30" r="6" fill="#FF7043"/>
    <circle cx="157" cy="30" r="6" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.8"/>
  </g>

  <!-- badge accent (green/blue dots referencing accent palette) -->
  <g opacity="0.9">
    <circle cx="820" cy="35" r="7" fill="#4CAF50"/>
    <circle cx="845" cy="35" r="7" fill="#42A5F5"/>
    <circle cx="795" cy="35" r="7" fill="#FF5722"/>
  </g>

  <!-- text -->
  <g font-family="'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="300" y="90" font-size="38" font-weight="800" fill="#f0f0f0">StatsUp</text>
    <text x="300" y="120" font-size="17" font-weight="600" fill="#FF7043">Your training, deeper than ever.</text>
    <text x="300" y="148" font-size="13" fill="#888888">Deep analytics for your Intervals.icu activities. For Android.</text>
    <text x="300" y="170" font-size="12" fill="#666666">fracassi-marco.github.io/StatsUp</text>
  </g>
</svg>
